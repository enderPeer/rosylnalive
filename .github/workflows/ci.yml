# CI (dev plan, section 7). build-test and hygiene are the required checks.
# GitHub-hosted runners have no GPU, so CI runs only the cpu tier. GPU and model tiers run locally.
name: ci

on:
  push:
    branches: [main]
  # labeled and unlabeled re-run hygiene when contract-change or ownership-exception changes. They re-run build-test
  # too: skipping it on a label event would leave a cancelled run behind a skipped (passing) required check.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Use a temporary LRM_DATA
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'lrm-data'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          "LRM_DATA=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'build/locks/*.json', '.config/dotnet-tools.json') }}

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.LRM_DATA }}/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/bootstrap/toolchain.json') }}

      - name: Bootstrap (DXC download allowed on runners, AP-1)
        run: ./tools/bootstrap/bootstrap.ps1 -AllowDownload

      - name: Bootstrap self-test (a second run downloads nothing; pending entries are never fetched)
        run: ./tools/bootstrap/test-bootstrap.ps1

      - name: DXC regression
        run: ./tools/bootstrap/dxc-regression.ps1

      - name: Fantomas check
        run: |
          dotnet tool restore
          dotnet fantomas --check .

      - name: Codegen diffs
        run: |
          ./tools/ci/gen-project-graph.ps1 -Check
          ./tools/bootstrap/gen-toolchain-props.ps1 -Check

      # CI=true makes every restore locked (Directory.Build.props): a stale build/locks/*.json fails here.
      - name: Restore (locked mode)
        run: dotnet restore Lrm.slnx --locked-mode --nologo

      - name: Release build
        run: dotnet build Lrm.slnx -c Release --nologo --no-restore

      # R3: the generated D3D12 binding is diff-clean against the pinned Windows SDK headers. On a runner whose SDK
      # servicing build differs from the pinned per-header SHA-256 values, the diff is skipped with a warning.
      - name: D3D12 codegen diff
        run: ./tools/d3d12gen/check.ps1 -NoBuild -SkipIfHeadersDiffer

      # R3: the cl.exe ABI oracle compiles static_asserts of every bound struct, slot, enum and signature against the
      # real d3d12.h and dxgi headers, then runs the oracle and its mutants.
      - name: cl.exe oracles (D3D12)
        run: ./tools/abi-oracle/d3d12/run.ps1 -NoBuild

      # R2: the generated Vulkan binding is diff-clean against the pinned vk.xml 1.4.365, which bootstrap fetches on
      # runners (AP-1) and checks against tools/bootstrap/toolchain.json.
      - name: Vulkan codegen diff
        run: ./tools/vkgen/check.ps1 -NoBuild

      # R2: the cl.exe ABI oracle compiles static_asserts of every bound struct, union, enum, constant, sType, pNext
      # extension and delegate signature against Vulkan-Headers 1.4.365 (vulkan_core.h and vulkan.hpp), runs it, and
      # cross-checks R1's hand-written spike layouts.
      - name: cl.exe oracles (Vulkan)
        run: ./tools/abi-oracle/vulkan/run.ps1 -NoBuild

      # R4a: catalog codegen diff, reproducible ShaderSetHash, incremental shader build, pinned DXC only.
      - name: Shader checks
        run: ./src/Lrm.Shaders.Build/check-shaders.ps1

      - name: Tests (cpu tier)
        run: ./tools/test.ps1 -Tier cpu -NoBuild -FailOnFocusedTests

      - name: Test summary
        if: always()
        run: |
          $summary = 'artifacts/test-results/cpu/summary.md'
          if (Test-Path $summary) { Get-Content $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cpu
          path: |
            artifacts/test-results/
            artifacts/dxc-regression/
          if-no-files-found: ignore

  # Ownership, layering, sizes, EOL and the contract-change label (OwnershipAndContractChange contract, S0b).
  # The checkers' self-test runs first: every fixture must fail as designed. Labels are read live, and a label change
  # starts a new run. The branch is judged by docs/ownership.json and tools/ci/hygiene.json at its merge base.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (full history and tags, for the branch diff and contracts-v1)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checker self-test (fixtures fail as designed)
        run: ./tools/ci/test-hygiene.ps1

      - name: Hygiene checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/hygiene.ps1 -Ci

      # O1: every committed golden set against its manifest (hashes, the 2 MiB file limit, budgets, unlisted files,
      # safetensors and tokenizer-corpus rules). Standard library only, so the runner's Python runs it in isolated mode.
      - name: Golden sets
        run: python3 -I tools/goldens/verify_goldens.py

      # The step above runs this PR's own tools/ci. A branch outside S0 that edits it fails the ownership check, unless
      # the edit switches that check off too; so the base commit's checker also judges the same tree.
      - name: Hygiene checks with the base commit's checker
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $base = $env:BASE_SHA
          git cat-file -e "${base}:tools/ci/hygiene.ps1" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "The base commit $base has no tools/ci/hygiene.ps1 yet; only this PR's checker ran."; exit 0 }
          git diff --quiet $base HEAD -- tools/ci
          if ($LASTEXITCODE -eq 0) { Write-Host "tools/ci is the same as in the base commit $base; the step above already ran that checker."; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'hygiene-base'
          $tar = Join-Path $env:RUNNER_TEMP 'hygiene-base.tar'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          git archive --format=tar -o $tar $base tools/ci
          if ($LASTEXITCODE -ne 0) { exit 2 }
          [System.Formats.Tar.TarFile]::ExtractToDirectory($tar, $dir, $true)
          & (Join-Path $dir 'tools/ci/hygiene.ps1') -Ci -RepoRoot $env:GITHUB_WORKSPACE -OutDir (Join-Path $env:GITHUB_WORKSPACE 'artifacts/hygiene/base')
          exit $LASTEXITCODE

      - name: Upload hygiene summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene
          path: artifacts/hygiene/
          if-no-files-found: ignore
